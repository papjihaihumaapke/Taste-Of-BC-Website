<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wave divider</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tobc.css">
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div style="width: 100%; height: {{h}}px; color: {{c}}; opacity: {{o}}" aria-hidden="true">
<svg class="wave-svg" viewBox="0 0 480 24" preserveAspectRatio="none" aria-hidden="true">
<path vector-effect="non-scaling-stroke" d="M0 6 q10 -5 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0"></path>
<path vector-effect="non-scaling-stroke" d="M0 12 q10 -5 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0"></path>
<path vector-effect="non-scaling-stroke" d="M0 18 q10 -5 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0"></path>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tone":{"editor":"enum","default":"red","options":["red","deep","white","ink"]},"h":{"editor":"int","default":24,"min":12,"max":64},"$preview":{"width":1440,"height":24}}'>
class Component extends DCLogic {
  renderVals() {
    const tone = this.props.tone ?? 'red';
    const c = { red: '#BC0214', deep: '#A70510', white: '#FFFFFF', ink: '#1A1A1A' }[tone] || '#BC0214';
    return { c, h: this.props.h ?? 24, o: tone === 'white' ? 0.45 : 1 };
  }
}
</script>
</body>
</html>
