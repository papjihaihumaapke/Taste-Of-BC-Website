<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Icon</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tobc.css">
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<span style="display: inline-flex; font-size: {{fs}}; line-height: 0">
<sc-if value="{{is.cart}}" hint-placeholder-val="{{ true }}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="20" r="1.5"></circle><circle cx="18" cy="20" r="1.5"></circle><path d="M2 3h3l2.6 12.2a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.5L22 7H6"></path></svg></sc-if>
<sc-if value="{{is.menu}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"></path></svg></sc-if>
<sc-if value="{{is.close}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></sc-if>
<sc-if value="{{is.search}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></sc-if>
<sc-if value="{{is.arrow}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></sc-if>
<sc-if value="{{is.arrowl}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></sc-if>
<sc-if value="{{is.plus}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></sc-if>
<sc-if value="{{is.minus}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path></svg></sc-if>
<sc-if value="{{is.check}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></sc-if>
<sc-if value="{{is.calendar}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></sc-if>
<sc-if value="{{is.pin}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.1-7-11.5a7 7 0 0 1 14 0C19 14.9 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg></sc-if>
<sc-if value="{{is.clock}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></sc-if>
<sc-if value="{{is.lock}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg></sc-if>
<sc-if value="{{is.ticket}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18v3a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4z"></path><path d="M14 7v10"></path></svg></sc-if>
<sc-if value="{{is.star}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"></path></svg></sc-if>
<sc-if value="{{is.leaf}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19c0-8 6-14 15-14 0 9-6 15-14 15"></path><path d="M5 19c3-4 6-6 9-7"></path></svg></sc-if>
<sc-if value="{{is.wine}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8l-.5 6a3.5 3.5 0 0 1-7 0z"></path><path d="M12 12.5V20M8 21h8"></path></svg></sc-if>
<sc-if value="{{is.fish}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 7l4 5-4 5"></path><path d="M6 12c3-4 6.5-6 10-6 3 0 5 3 6 6-1 3-3 6-6 6-3.5 0-7-2-10-6z"></path></svg></sc-if>
<sc-if value="{{is.users}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"></path></svg></sc-if>
<sc-if value="{{is.store}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l1.5-5h15L21 9"></path><path d="M3 9a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0"></path><path d="M5 12v9h14v-9"></path></svg></sc-if>
<sc-if value="{{is.heart}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-8-4.6-8-10.5A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 8 2.5C20 15.4 12 20 12 20z"></path></svg></sc-if>
<sc-if value="{{is.mail}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg></sc-if>
<sc-if value="{{is.instagram}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r=".8"></circle></svg></sc-if>
<sc-if value="{{is.facebook}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 8h3V4h-3a4 4 0 0 0-4 4v3H7v4h3v6h4v-6h3l1-4h-4V8z"></path></svg></sc-if>
<sc-if value="{{is.tiktok}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5"></path><path d="M14 3a5 5 0 0 0 5 5"></path></svg></sc-if>
<sc-if value="{{is.youtube}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="4"></rect><path d="M10 9l5 3-5 3z"></path></svg></sc-if>
<sc-if value="{{is.image}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-9 9"></path></svg></sc-if>
<sc-if value="{{is.trash}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg></sc-if>
<sc-if value="{{is.gift}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="4"></rect><path d="M5 12v9h14v-9M12 8v13"></path><path d="M12 8c-2-4-6-4-6-1.5S9 8 12 8c3 0 6-.5 6-1.5S14 4 12 8z"></path></svg></sc-if>
<sc-if value="{{is.info}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5v.5"></path></svg></sc-if>
<sc-if value="{{is.alert}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16.5v.5"></path></svg></sc-if>
<sc-if value="{{is.chevd}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></sc-if>
<sc-if value="{{is.chevr}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></sc-if>
<sc-if value="{{is.external}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg></sc-if>
<sc-if value="{{is.bus}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="15" rx="3"></rect><path d="M5 11h14M8 21l1-3M16 21l-1-3"></path></svg></sc-if>
<sc-if value="{{is.tag}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8z"></path><circle cx="7.5" cy="8.5" r="1.5"></circle></svg></sc-if>
<sc-if value="{{is.shirt}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3l-5 3 2 5 3-1v11h8V10l3 1 2-5-5-3a4 4 0 0 1-8 0z"></path></svg></sc-if>
<sc-if value="{{is.mountain}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 20l7-12 4 6 3-4 6 10z"></path><path d="M7.5 10.5l1.5 1.5 1.5-1.5"></path></svg></sc-if>
<sc-if value="{{is.card}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"></rect><path d="M2 10h20M6 15h4"></path></svg></sc-if>
<sc-if value="{{is.download}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg></sc-if>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"n":{"editor":"enum","default":"cart","options":["cart","menu","close","search","arrow","arrowl","plus","minus","check","calendar","pin","clock","lock","ticket","star","leaf","wine","fish","users","store","heart","mail","instagram","facebook","tiktok","youtube","image","trash","gift","info","alert","chevd","chevr","external","bus","tag","shirt","mountain","card","download"]},"s":{"editor":"int","default":24,"min":12,"max":96},"$preview":{"width":48,"height":48}}'>
class Component extends DCLogic {
  renderVals() {
    const n = this.props.n ?? 'cart';
    const is = {}; is[n] = true;
    const s = this.props.s; return { is, fs: s ? s + "px" : "inherit" };
  }
}
</script>
</body>
</html>
